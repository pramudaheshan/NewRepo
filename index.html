<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservations Management</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #1f2937;
    }
    .container {
      max-width: 960px;
      margin: 2rem auto;
      background: #fff;
      padding: 1.25rem;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 { margin-top: 0; }
    form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    input, textarea, button {
      font: inherit;
      padding: 0.55rem;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
    }
    textarea { resize: vertical; min-height: 2.6rem; }
    button {
      cursor: pointer;
      border: none;
      color: #fff;
      background: #2563eb;
    }
    button.secondary { background: #64748b; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 0.5rem;
    }
    th, td {
      text-align: left;
      padding: 0.6rem;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }
    td.actions {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 0.1rem 0.55rem;
      font-size: 0.8rem;
      color: #fff;
    }
    .confirmed { background: #059669; }
    .pending { background: #d97706; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Reservations Management</h1>

    <form id="reservation-form">
      <input id="customer" type="text" placeholder="Customer name" required />
      <input id="date" type="date" required />
      <input id="time" type="time" required />
      <input id="party-size" type="number" min="1" placeholder="Party size" required />
      <textarea id="notes" placeholder="Notes (optional)"></textarea>
      <button id="submit-button" type="submit">Add reservation</button>
    </form>

    <table aria-label="Reservations list">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Date</th>
          <th>Time</th>
          <th>Party</th>
          <th>Status</th>
          <th>Notes</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="reservations-body"></tbody>
    </table>
  </main>

  <script>
    const STORAGE_KEY = "reservations";
    const form = document.getElementById("reservation-form");
    const customerField = document.getElementById("customer");
    const dateField = document.getElementById("date");
    const timeField = document.getElementById("time");
    const partySizeField = document.getElementById("party-size");
    const notesField = document.getElementById("notes");
    const submitButton = document.getElementById("submit-button");
    const reservationsBody = document.getElementById("reservations-body");

    let reservations = loadReservations();
    let editId = null;

    function loadReservations() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const parsed = saved ? JSON.parse(saved) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveReservations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reservations));
    }

    function renderReservations() {
      reservationsBody.innerHTML = "";

      for (const reservation of reservations) {
        const tr = document.createElement("tr");
        const statusClass = reservation.status === "Confirmed" ? "confirmed" : "pending";
        tr.innerHTML = `
          <td>${escapeHtml(reservation.customer)}</td>
          <td>${reservation.date}</td>
          <td>${reservation.time}</td>
          <td>${reservation.partySize}</td>
          <td><span class="status ${statusClass}">${reservation.status}</span></td>
          <td>${escapeHtml(reservation.notes || "-")}</td>
          <td class="actions">
            <button type="button" data-action="toggle" data-id="${reservation.id}" class="secondary">Toggle status</button>
            <button type="button" data-action="edit" data-id="${reservation.id}">Edit</button>
            <button type="button" data-action="delete" data-id="${reservation.id}" class="secondary">Delete</button>
          </td>
        `;
        reservationsBody.appendChild(tr);
      }
    }

    function resetForm() {
      form.reset();
      editId = null;
      submitButton.textContent = "Add reservation";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const data = {
        customer: customerField.value.trim(),
        date: dateField.value,
        time: timeField.value,
        partySize: Number.parseInt(partySizeField.value, 10),
        notes: notesField.value.trim(),
      };

      if (!data.customer || !data.date || !data.time || !Number.isInteger(data.partySize) || data.partySize < 1) {
        return;
      }

      if (editId) {
        reservations = reservations.map((reservation) =>
          reservation.id === editId
            ? { ...reservation, ...data }
            : reservation,
        );
      } else {
        reservations.push({
          id: crypto.randomUUID(),
          status: "Pending",
          ...data,
        });
      }

      saveReservations();
      renderReservations();
      resetForm();
    });

    reservationsBody.addEventListener("click", (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) {
        return;
      }

      const id = target.getAttribute("data-id");
      const action = target.getAttribute("data-action");
      if (!id || !action) {
        return;
      }

      const reservation = reservations.find((item) => item.id === id);
      if (!reservation) {
        return;
      }

      if (action === "delete") {
        reservations = reservations.filter((item) => item.id !== id);
      } else if (action === "toggle") {
        reservation.status = reservation.status === "Confirmed" ? "Pending" : "Confirmed";
      } else if (action === "edit") {
        editId = id;
        customerField.value = reservation.customer;
        dateField.value = reservation.date;
        timeField.value = reservation.time;
        partySizeField.value = String(reservation.partySize);
        notesField.value = reservation.notes;
        submitButton.textContent = "Update reservation";
        return;
      }

      saveReservations();
      renderReservations();
      if (action !== "edit") {
        resetForm();
      }
    });

    renderReservations();
  </script>
</body>
</html>
